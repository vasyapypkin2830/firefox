 - name: Download IceCat Branding Icons
      shell: bash
      run: |
        echo "=== Скачиваем официальные иконки IceCat для теста ==="
        # Создаем временную папку и вытягиваем туда ресурсы брендинга IceCat
        mkdir -p icecat-icons
        curl -L https://gnu.org -o icecat-icons/firefox.ico
        curl -L https://gnu.org -o icecat-icons/default16.png
        curl -L https://gnu.org -o icecat-icons/default32.png
        curl -L https://gnu.org -o icecat-icons/default64.png
        curl -L https://gnu.org -o icecat-icons/default128.png

        echo "=== Заменяем оригинальные иконки Firefox на тестовые иконки IceCat ==="
        cp -f icecat-icons/* browser/branding/official/
        
        
name: Build BlackCat (Windows Artifact Build)
on:
  push:
    branches: [ master, main ]
  workflow_dispatch: # Позволит вам запускать сборку вручную кнопкой с телефона

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Mozilla Build Tools Dependencies
      run: |
        choco install mach -y

    - name: Configure Artifact Build
      run: |
        # Создаем конфигурационный файл для быстрой сборки без компиляции C++ кода
        echo "ac_add_options --enable-artifact-builds" > mozconfig
        echo "ac_add_options --with-branding=browser/branding/official" >> mozconfig

    - name: Bootstrap and Build
      shell: bash
      run: |
        # Запуск внутренней утилиты mach для подготовки окружения и сборки
        ./mach bootstrap --application-choice="Firefox for Desktop Artifact Build" --no-interactive
        ./mach build

    - name: Package Installer
      shell: bash
      run: |
        ./mach package

    - name: Upload Installer Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BlackCat-Windows-Installer
        path: objdir-frontend/dist/install/sea/*.exe
