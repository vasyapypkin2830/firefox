name: Build BlackCat (Fixed IceCat Test)

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # Исправление: Гарантируем наличие необходимых инструментов сборки Mozilla в Windows
    - name: Install MozillaBuild Tools via Chocolatey
      run: |
        choco install mozillabuild -y --no-progress
        echo "C:\mozilla-build" >> $GITHUB_PATH

    - name: Download IceCat Branding Icons
      shell: bash
      run: |
        echo "=== Скачиваем официальные иконки IceCat для теста ==="
        mkdir -p icecat-icons
        curl -L "https://gnu.org" -o icecat-icons/firefox.ico
        curl -L "https://gnu.org" -o icecat-icons/default16.png
        curl -L "https://gnu.org" -o icecat-icons/default32.png
        curl -L "https://gnu.org" -o icecat-icons/default64.png
        cp -f icecat-icons/* browser/branding/official/

    - name: Configure Artifact Build
      run: |
        echo "ac_add_options --enable-artifact-builds" > mozconfig
        echo "ac_add_options --with-branding=browser/branding/official" >> mozconfig

    # Исправление: Запуск через официальную консоль MozillaBuild (start-shell.bat)
    - name: Bootstrap and Build
      run: |
        C:\mozilla-build\start-shell.bat "./mach bootstrap --application-choice='Firefox for Desktop Artifact Build' --no-interactive && ./mach build"

    - name: Package Installer
      run: |
        C:\mozilla-build\start-shell.bat "./mach package"

    - name: Upload Installer Artifact
      uses: actions/upload-artifact@v4
      with:
        name: IceCat-Test-Windows-Installer
        path: objdir-frontend/dist/install/sea/*.exe
