name: Build BlackCat (IceCat Test Build)

on:
  push:
    branches: [ master, main ]
  workflow_dispatch: # Позволяет запускать сборку кнопкой с телефона

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Download IceCat Branding Icons
      shell: bash
      run: |
        echo "=== Скачиваем официальные иконки IceCat для теста ==="
        mkdir -p icecat-icons
        # Скачиваем оригинальный пакет иконок ледяного кота из репозитория GNUzilla
        curl -L "https://gnu.org" -o icecat-icons/firefox.ico
        curl -L "https://gnu.org" -o icecat-icons/default16.png
        curl -L "https://gnu.org" -o icecat-icons/default32.png
        curl -L "https://gnu.org" -o icecat-icons/default64.png
        
        echo "=== Переносим скачанные иконки в структуру сборки Firefox ==="
        cp -f icecat-icons/* browser/branding/official/

    - name: Configure Artifact Build
      run: |
        echo "ac_add_options --enable-artifact-builds" > mozconfig
        echo "ac_add_options --with-branding=browser/branding/official" >> mozconfig

    - name: Bootstrap and Build
      shell: bash
      run: |
        ./mach bootstrap --application-choice="Firefox for Desktop Artifact Build" --no-interactive
        ./mach build

    - name: Package Installer
      shell: bash
      run: |
        ./mach package

    - name: Upload Installer Artifact
      uses: actions/upload-artifact@v4
      with:
        name: IceCat-Test-Windows-Installer
        path: objdir-frontend/dist/install/sea/*.exe
